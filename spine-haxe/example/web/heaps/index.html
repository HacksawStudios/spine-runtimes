<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Spine Haxe Heaps Examples</title>
	<style>
		html, body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			background: #000;
			overflow: hidden;
		}

		body {
			font-family: Georgia, "Times New Roman", serif;
		}

		#webgl {
			display: block;
			width: 100vw;
			height: 100vh;
		}

		#preloader {
			position: fixed;
			left: 50%;
			top: 50%;
			width: min(180px, 38vw);
			height: 2px;
			transform: translate(-50%, -50%);
			background: rgba(255, 255, 255, 0.16);
			z-index: 9999;
			transition: opacity 120ms ease;
			overflow: hidden;
		}

		#preloader::after {
			content: "";
			position: absolute;
			inset: 0;
			background: #ffffff;
			transform-origin: 0 50%;
			animation: heaps-preloader-sweep 0.9s ease-in-out infinite;
		}

		body.ready #preloader {
			opacity: 0;
			pointer-events: none;
		}

		@keyframes heaps-preloader-sweep {
			0% { transform: scaleX(0.15); opacity: 0.4; }
			50% { transform: scaleX(1); opacity: 1; }
			100% { transform: scaleX(0.15) translateX(420%); opacity: 0.4; }
		}
	</style>
</head>
<body>
	<div id="preloader" aria-hidden="true"></div>
	<canvas id="webgl"></canvas>
	<script>
		window.addEventListener("spine-heaps-ready", function () {
			document.body.classList.add("ready");
			window.setTimeout(function () {
				var preloader = document.getElementById("preloader");
				if (preloader) preloader.remove();
			}, 140);
		}, { once: true });
	</script>
	<script src="./MainHeaps.js"></script>
</body>
</html>
